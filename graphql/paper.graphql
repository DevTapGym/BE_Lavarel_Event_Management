# Paper Type
type Paper {
    _id: ID!
    title: String!
    abstract: String
    author: [String!]!
    event_id: ID!
    file_url: String
    view: Int!
    download: Int!
    category: String
    language: String
    keywords: [String!]
    created_at: DateTime
    updated_at: DateTime

    # Relations
    event: Event @belongsTo(relation: "event")
}

# Input Types
input CreatePaperInput {
    title: String!
    abstract: String
    author: [String!]!
    event_id: ID!
    file_url: String
    category: String
    language: String
    keywords: [String!]
}

input UpdatePaperInput {
    _id: ID!
    title: String
    abstract: String
    author: [String!]
    event_id: ID
    view: Int
    file_url: String
    category: String
    language: String
    keywords: [String!]
}

# Queries
extend type Query {
    papers: [Paper!]!
        @all
        @checkPermission(permission: "view-papers")
        @middleware(checks: ["jwt.auth", "active"])
    paper(_id: ID! @eq): Paper
        @find
        @checkPermission(permission: "view-detail-papers")
        @middleware(checks: ["jwt.auth", "active"])
}

# Mutations
extend type Mutation {
    # Tạo paper mới
    createPaper(input: CreatePaperInput! @spread): Paper
        @field(resolver: "App\\GraphQL\\Mutations\\PaperMutation@create")
        @checkPermission(permission: "create-paper")
        @middleware(checks: ["jwt.auth", "active"])

    # Cập nhật paper
    updatePaper(input: UpdatePaperInput! @spread): Paper
        @field(resolver: "App\\GraphQL\\Mutations\\PaperMutation@update")
        @checkPermission(permission: "update-paper")
        @middleware(checks: ["jwt.auth", "active"])

    # Xóa paper
    deletePaper(_id: ID!): Paper
        @field(resolver: "App\\GraphQL\\Mutations\\PaperMutation@delete")
        @checkPermission(permission: "delete-paper")
        @middleware(checks: ["jwt.auth", "active"])
}
