type User {
    _id: ID!
    name: String!
    email: String!
    avatar: String
    phone: String
    is_active: Boolean!
    reputation_score: Int!
    roles: [String!]
    created_at: DateTime
    updated_at: DateTime
}

input ResetAllUserPointsInput {
    points: Int
    reason: String
}

type ResetPointsResponse {
    success: Boolean!
    message: String!
    updated_count: Int!
    total_users: Int!
    new_points: Int!
}

type UpdateAlertResponse {
    success: Boolean!
    message: String!
    alert: AlertData
}

type AlertData {
    alert_index: Int
    title: String
    message: String
    type: String
    is_read: Boolean
    is_deleted: Boolean
    created_at: String
}

# Mutations
extend type Mutation {
    # Reset điểm cho toàn bộ người dùng
    resetAllUserPoints(
        input: ResetAllUserPointsInput @spread
    ): ResetPointsResponse!
        @field(
            resolver: "App\\GraphQL\\Mutations\\UserMutation@resetAllUserPoints"
        )

    # Cập nhật trạng thái một alert
    updateAlert(
        user_id: String!
        alert_index: Int!
        is_read: Boolean
        is_deleted: Boolean
    ): UpdateAlertResponse!
        @middleware(checks: ["jwt.auth", "active"])
        @field(resolver: "App\\GraphQL\\Mutations\\UserMutation@updateAlert")
}
