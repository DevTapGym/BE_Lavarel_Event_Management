type User {
    _id: ID!
    name: String!
    email: String!
    avatar: String
    phone: String
    is_active: Boolean!
    reputation_score: Int!
    roles: [String!]
    created_at: DateTime
    updated_at: DateTime
}

input ResetAllUserPointsInput {
    points: Int
    reason: String
}

type ResetPointsResponse {
    success: Boolean!
    message: String!
    updated_count: Int!
    total_users: Int!
    new_points: Int!
}

type UpdateAlertResponse {
    success: Boolean!
    message: String!
    alert: AlertData
}

type AlertData {
    alert_index: Int
    title: String
    message: String
    type: String
    is_read: Boolean
    is_deleted: Boolean
    created_at: String
}

type ReputationAlertResponse {
    success: Boolean!
    message: String!
    warning_count: Int!
    blocked_count: Int!
    skipped_count: Int!
    total_processed: Int!
}

type CreateUserResponse {
    success: Boolean!
    message: String!
    user: User
}

type ResetPasswordResponse {
    success: Boolean!
    message: String!
}

# Queries
extend type Query {
    # Lấy tất cả users
    getAllUser: [User!]!
        @all
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "view-all-users")

    # Lấy thông tin user theo ID
    getUserById(id: ID! @eq): User
        @find
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "view-user-detail")
}

# Mutations
extend type Mutation {
    # Reset điểm cho toàn bộ người dùng
    resetAllUserPoints(
        input: ResetAllUserPointsInput @spread
    ): ResetPointsResponse!
        @field(
            resolver: "App\\GraphQL\\Mutations\\UserMutation@resetAllUserPoints"
        )
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "reset-all-user-points")

    # Cập nhật trạng thái một alert
    updateAlert(
        user_id: String!
        alert_index: Int!
        is_read: Boolean
        is_deleted: Boolean
    ): UpdateAlertResponse!
        @middleware(checks: ["jwt.auth", "active"])
        @field(resolver: "App\\GraphQL\\Mutations\\UserMutation@updateAlert")
        @checkPermission(permission: "update-user-alert")

    # Kiểm tra và gửi cảnh báo cho người dùng có điểm thấp
    checkAndSendReputationAlerts: ReputationAlertResponse!
        @field(
            resolver: "App\\GraphQL\\Mutations\\UserMutation@checkAndSendReputationAlerts"
        )
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "send-reputation-alerts")

    # Tạo user mới
    createUser(
        name: String
        email: String!
        password: String!
        phone: String
    ): CreateUserResponse!
        @field(resolver: "App\\GraphQL\\Mutations\\UserMutation@createUser")
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "create-user")

    # Reset mật khẩu cho user
    resetUserPassword(
        user_id: String!
        new_password: String!
    ): ResetPasswordResponse!
        @field(
            resolver: "App\\GraphQL\\Mutations\\UserMutation@resetUserPassword"
        )
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "reset-user-password")
}
