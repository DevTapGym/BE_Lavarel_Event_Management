"Kiểu dữ liệu Location"
type Location {
    id: ID!
    name: String!
    building: String
    address: String
    capacity: Int
    created_at: DateTime
    updated_at: DateTime
}

extend type Query {
    "Lấy tất cả locations"
    locations: [Location!]!
        @all
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "view-locations")

    "Lấy location theo ID"
    location(id: ID! @eq): Location
        @find
        @middleware(checks: ["jwt.auth", "active"])
        @checkPermission(permission: "view-detail-locations")
}

extend type Mutation {
    "Tạo location mới"
    createLocation(
        name: String!
        building: String
        address: String
        capacity: Int
    ): Location!
        @middleware(checks: ["jwt.auth", "active"])
        @field(resolver: "App\\GraphQL\\Mutations\\LocationMutation@create")
        @checkPermission(permission: "create-location")

    "Cập nhật location"
    updateLocation(
        id: ID!
        name: String
        building: String
        address: String
        capacity: Int
    ): Location
        @middleware(checks: ["jwt.auth", "active"])
        @field(resolver: "App\\GraphQL\\Mutations\\LocationMutation@update")
        @checkPermission(permission: "update-location")

    "Xóa location"
    deleteLocation(id: ID!): Location
        @middleware(checks: ["jwt.auth", "active"])
        @field(resolver: "App\\GraphQL\\Mutations\\LocationMutation@delete")
        @checkPermission(permission: "delete-location")
}
